---
- name: Will this work?
  hosts: localhost
  connection: ansible.builtin.local
  gather_facts: false

  tasks:
    - name: Create Minecraft data directory
      become: true
      ansible.builtin.file:
        path: /opt/minecraft
        state: directory
        mode: "0755"

    - name: Start Minecraft server container
      community.docker.docker_container:
        name: minecraft
        image: itzg/minecraft-server:latest
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "25565:25565"
        volumes:
          - /opt/minecraft:/data
        env:
          EULA: "TRUE"
          TYPE: "PAPER"
          MEMORY: "2G"
          MOTD: "Planet Express Minecraft Server"
          DIFFICULTY: "normal"
          MAX_PLAYERS: "10"

    - name: Wait for Minecraft port to become available
      ansible.builtin.wait_for:
        port: 25565
        delay: 5
        timeout: 120

    - name: Display connection information
      ansible.builtin.debug:
        msg: "Minecraft server is running on {{ inventory_hostname }}:25565"
